services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cygnusx1
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: cygnusx1
    volumes:
      - cygnusx1_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cygnusx1 -d cygnusx1"]
      interval: 5s
      timeout: 5s
      retries: 12
    # Uncomment to reach Postgres from the host (pgAdmin, psql):
    # ports:
    #   - "5432:5432"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: cygnusx1-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql://cygnusx1:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/cygnusx1
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DASHBOARD_TOKEN: ${DASHBOARD_TOKEN:?Set DASHBOARD_TOKEN in .env}
      APP_ENV: ${APP_ENV:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:8080,http://localhost:8080}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
      LLM_MODEL: ${LLM_MODEL:-llama3.1}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-60}
      XAI_API_KEY: ${XAI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  cygnusx1_pg:
