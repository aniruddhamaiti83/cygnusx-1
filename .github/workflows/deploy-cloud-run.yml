name: Deploy API to Google Cloud Run

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Cloud Run service name"
        required: true
        default: "cygnusx1-api"
      region:
        description: "GCP region"
        required: true
        default: "us-central1"

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Configure project and verify required secrets
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          DATABASE_URL_SECRET: ${{ vars.DATABASE_URL_SECRET }}
          SECRET_KEY_SECRET: ${{ vars.SECRET_KEY_SECRET }}
          DASHBOARD_TOKEN_SECRET: ${{ vars.DASHBOARD_TOKEN_SECRET }}
        run: |
          set -euo pipefail
          test -n "$PROJECT_ID"
          test -n "$DATABASE_URL_SECRET"
          test -n "$SECRET_KEY_SECRET"
          test -n "$DASHBOARD_TOKEN_SECRET"
          gcloud config set project "$PROJECT_ID"
      - uses: docker/setup-buildx-action@v3
      - name: Build and push image
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ inputs.region }}
          SERVICE: ${{ inputs.service }}
        run: |
          set -euo pipefail
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/cygnusx1/$SERVICE:$GITHUB_SHA"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -f backend/Dockerfile -t "$IMAGE" ./backend
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Deploy to Cloud Run
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ inputs.region }}
          SERVICE: ${{ inputs.service }}
          DATABASE_URL_SECRET: ${{ vars.DATABASE_URL_SECRET }}
          SECRET_KEY_SECRET: ${{ vars.SECRET_KEY_SECRET }}
          DASHBOARD_TOKEN_SECRET: ${{ vars.DASHBOARD_TOKEN_SECRET }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
        run: |
          set -euo pipefail
          test -n "$CORS_ORIGINS"
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" --region "$REGION" --project "$PROJECT_ID" \
            --platform managed --port 8000 --execution-environment gen2 \
            --set-env-vars "APP_ENV=production,CORS_ORIGINS=$CORS_ORIGINS,WEB_CONCURRENCY=1" \
            --set-secrets "DATABASE_URL=$DATABASE_URL_SECRET:latest,SECRET_KEY=$SECRET_KEY_SECRET:latest,DASHBOARD_TOKEN=$DASHBOARD_TOKEN_SECRET:latest" \
            --min 1 --max 10 --cpu 1 --memory 1Gi --timeout 300 --no-allow-unauthenticated
          gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT_ID" --format='value(status.url)'
